apiVersion: eshu.dev/v1alpha1
kind: ComponentPackage
metadata:
  id: dev.eshu.collector.terraform-state
  name: Terraform State collector
  publisher: eshu-hq
  version: 0.1.0
spec:
  compatibleCore: ">=0.0.5 <0.2.0"
  componentType: collector
  collectorKinds:
    - terraform_state
  runtime:
    sdkProtocol: collector-sdk/v1alpha1
    adapter: process
  artifacts:
    # Pinned 0.1.0 linux/amd64 image via scripts/pin-digest.sh.
    - platform: linux/amd64
      image: ghcr.io/eshu-hq/eshu-collector-terraform-state@sha256:ae5bfbc85790360a2837886a3c5157b03448d3cc4358a2134f0e2a51f22170f6
  emittedFacts:
    - kind: terraform_state_snapshot
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - observed
    - kind: terraform_state_resource
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - observed
    - kind: terraform_state_output
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - observed
    - kind: terraform_state_module
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - observed
    - kind: terraform_state_provider_binding
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - observed
    - kind: terraform_state_tag_observation
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - observed
    - kind: terraform_state_warning
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - observed
    - kind: incident_routing.applied_pagerduty_resource
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - observed
    - kind: incident_routing.applied_alert_route
      schemaVersions:
        - 1.0.0
      sourceConfidence:
        - observed
    # No incident_routing.coverage_warning: the shared component registry
    # enforces one owner per fact kind and dev.eshu.collector.pagerduty owns
    # it (ops-qa installer conflict, eshu-hq/eshu#8868). Partial reversal of
    # the #9195 EXTEND per arbiter verdict (coverage_warning only).
  consumerContracts:
    reducer:
      phases:
        - source_evidence_only:no_graph_truth
  telemetry:
    metricsPrefix: eshu_dp_tfstate_
