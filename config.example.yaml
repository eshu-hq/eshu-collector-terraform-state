host:
  sourceSystem: terraform_state
  scope:
    id: component:terraform-state-primary
    kind: component
process:
  command: ./collector
  args:
    - --sdk-stdio
config:
  source:
    mode: local-file
    input: ./testdata/complete.json
    sourceURI: https://example.invalid/source/terraform-state
  freshness:
    previousDigest: ""
  limits:
    maxRecordsPerClaim: 5000
    maxPayloadBytes: 65536
    claimTimeoutSeconds: 300
  # Live activation (replaces source.input): discovery plus target_scopes.
  # The collector resolves bucket filters/seeds to exact S3 objects and
  # reads with ambient workload credentials only (IRSA web identity, then
  # the process environment triple). No credential key exists in config.
  #
  # S3-compatible endpoint override (MinIO / offline): set AWS_S3_ENDPOINT
  # on the collector process to a trusted base URL and every live S3 read
  # addresses it path-style (base/bucket/key). Unset keeps the regional
  # AWS endpoints with virtual-hosted addressing. The value must be an
  # http(s) base URL with no credentials, query, or fragment; instance
  # metadata destinations (169.254.0.0/16, the metadata hostnames) are
  # refused, and plain http is accepted only on loopback plus single-label
  # in-cluster DNS names (e.g. a compose service name). See README
  # ("S3 endpoint override") for the full trust posture. AWS_STS_ENDPOINT
  # carries the same gate for the IRSA exchange, without the single-label
  # allowance.
  #   AWS_S3_ENDPOINT=http://localhost:9000
  # discovery:
  #   backend_filters:
  #     - target_scope_id: ops-qa-aws
  #       backend_kind: s3
  #       bucket: bg-ops-qa-terraform-state
  #       region: us-east-1
  # target_scopes:
  #   - target_scope_id: ops-qa-aws
  #     provider: aws
  #     deployment_mode: account_local
  #     allowed_regions: [us-east-1]
  #     allowed_backends: [s3]
